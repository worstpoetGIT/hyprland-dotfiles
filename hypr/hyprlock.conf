background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
    noise = 0.01
}

# Clock face
shape {
    monitor =
    size = 200, 200
    color = rgba(0, 0, 0, 50)
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 80)
    position = 0, 150
    halign = center
    valign = center
}

# Hour hand
shape {
    monitor =
    size = 5, 55
    color = rgba(255, 255, 255, 255)
    rounding = 2
    rotate = cmd[update:60000] echo $(( ($(date +%-I) * 30) + ($(date +%-M) / 2) ))
    position = 0, 150
    halign = center
    valign = center
}

# Minute hand
shape {
    monitor =
    size = 3, 72
    color = rgba(255, 255, 255, 220)
    rounding = 2
    rotate = cmd[update:1000] echo $(( $(date +%-M) * 6 ))
    position = 0, 150
    halign = center
    valign = center
}

# Second hand
shape {
    monitor =
    size = 1, 78
    color = rgba(130, 200, 255, 230)
    rounding = 1
    rotate = cmd[update:1000] echo $(( $(date +%-S) * 6 ))
    position = 0, 150
    halign = center
    valign = center
}

# Center dot
shape {
    monitor =
    size = 10, 10
    color = rgba(255, 255, 255, 255)
    rounding = -1
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%a, %d %b %Y')"
    color = rgba(255, 255, 255, 220)
    font_size = 20
    font_family = Noto Sans
    position = 0, 30
    halign = center
    valign = center
}

# Avatar
image {
    monitor =
    path = /home/worst_poet/.face
    size = 80
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 150)
    position = 0, -50
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = worst_poet
    color = rgba(255, 255, 255, 200)
    font_size = 16
    font_family = Noto Sans
    position = 0, -145
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    inner_color = rgba(0, 0, 0, 120)
    font_color = rgba(255, 255, 255, 255)
    outer_color = rgba(255, 255, 255, 80)
    check_color = rgba(0, 200, 100, 200)
    fail_color = rgba(255, 80, 80, 200)
    placeholder_text = Enter password...
    rounding = 25
    position = 0, -215
    halign = center
    valign = center
}
